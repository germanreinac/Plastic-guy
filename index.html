<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plastic Guy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed 3D stage. The guy lies on a round board in the middle; controls sit in the corners. */
:root {
  --bg: #ffffff;
  --fg: #0b0b0b;
  --mute: rgba(11, 11, 11, .5);
  --line: rgba(11, 11, 11, .16);
  --disc: #ecece9;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --fg: #f6f6f6;
    --mute: rgba(246, 246, 246, .55); --line: rgba(246, 246, 246, .2); --disc: #2a2a2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0b; --fg: #f6f6f6;
  --mute: rgba(246, 246, 246, .55); --line: rgba(246, 246, 246, .2); --disc: #2a2a2a;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 11px/1.4 var(--mono);
  overflow: hidden;
  padding-left: var(--gl);
  padding-right: var(--gr);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#stage.holding { cursor: grabbing; }

.top {
  position: fixed; inset: 0 0 auto 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gr) 0 var(--gl);
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.mark {
  margin: 0;
  font: 700 17px/1 var(--display);
  letter-spacing: -.02em;
}
.actions { display: flex; gap: 6px; }

button {
  font: 500 11px/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--fg);
  border-radius: 999px;
  padding: 9px 13px;
  cursor: pointer;
}
button[aria-pressed="true"], button[aria-expanded="true"], button[aria-checked="true"] {
  background: var(--fg); color: var(--bg);
}
@media (hover: hover) { button:hover { background: var(--fg); color: var(--bg); } }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.tools {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex;
  border: 1px solid var(--fg);
  border-radius: 999px;
  background: var(--bg);
  padding: 3px; gap: 2px;
}
.tools button { border-color: transparent; padding: 9px 16px; }

#hint {
  position: fixed; left: 0; right: 0;
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding: 0 var(--gr) 0 var(--gl);
  text-align: center;
  color: var(--mute);
  letter-spacing: .08em; text-transform: uppercase;
  pointer-events: none;
  transition: opacity .6s;
}
#hint.gone { opacity: 0; }

#panel {
  position: fixed;
  top: calc(58px + env(safe-area-inset-top, 0px));
  right: var(--gr);
  width: min(236px, calc(100vw - 32px));
  box-sizing: border-box;
  background: var(--bg);
  border: 1px solid var(--fg);
  border-radius: 18px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: baseline; }
.row label { letter-spacing: .08em; text-transform: uppercase; }
.row output { color: var(--mute); font-variant-numeric: tabular-nums; }
.row input { grid-column: 1 / -1; }
.ends { grid-column: 1 / -1; display: flex; justify-content: space-between; color: var(--mute); font-size: 10px; }
.switches { display: flex; gap: 6px; padding-top: 2px; }
.switches button { flex: 1; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 18px; margin: 0;
  background: transparent; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--fg); }
input[type="range"]::-moz-range-track { height: 1px; background: var(--fg); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; margin-top: -8px;
  border-radius: 50%; background: var(--fg); border: 0;
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; background: var(--fg); border: 0;
}

@media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="A clay figure lying on a board. Drag it to deform it; drag the background to look around."></canvas>

<header class="top">
  <h1 class="mark">plastic guy</h1>
  <div class="actions">
    <button id="tune-btn" type="button" aria-expanded="false" aria-controls="panel">Tune</button>
    <button id="reset-btn" type="button">Reset</button>
  </div>
</header>

<section id="panel" aria-label="Putty settings" hidden>
  <div class="row">
    <label for="soft">Softness</label><output id="soft-out" for="soft">40</output>
    <input id="soft" type="range" min="0" max="100" value="40">
    <div class="ends"><span>firm</span><span>gooey</span></div>
  </div>
  <div class="row">
    <label for="mem">Spring back</label><output id="mem-out" for="mem">10</output>
    <input id="mem" type="range" min="0" max="100" value="10">
    <div class="ends"><span>clay</span><span>rubber</span></div>
  </div>
  <div class="row">
    <label for="slide">Slide</label><output id="slide-out" for="slide">30</output>
    <input id="slide" type="range" min="0" max="100" value="30">
    <div class="ends"><span>sticky</span><span>slippery</span></div>
  </div>
  <div class="row">
    <label for="finger">Finger size</label><output id="finger-out" for="finger">40</output>
    <input id="finger" type="range" min="0" max="100" value="40">
    <div class="ends"><span>fingertip</span><span>whole palm</span></div>
  </div>
  <div class="switches">
    <button id="mesh-btn" type="button" aria-pressed="false">Mesh</button>
    <button id="clay-btn" type="button" aria-pressed="false">Dark clay</button>
  </div>
  <div class="switches">
    <button id="invert-btn" type="button">Invert room</button>
  </div>
</section>

<p id="hint">Drag the guy to shape him. Drag the background to look around.</p>

<nav class="tools" role="radiogroup" aria-label="Tool">
  <button type="button" role="radio" aria-checked="true" data-tool="pull" id="tool-pull">Pull</button>
  <button type="button" role="radio" aria-checked="false" data-tool="press" id="tool-press">Press</button>
  <button type="button" role="radio" aria-checked="false" data-tool="pinch" id="tool-pinch">Pinch</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('stage');
  if (!window.THREE) { $('hint').textContent = 'Could not load the 3D engine. Check your connection and reload.'; return; }
  const T3 = window.THREE;

  // ---------- settings ----------
  const P = { soft: .4, mem: .1, slide: .3, finger: .4, mesh: false, dark: false };
  let tool = 'pull';
  const H = .028;                       // spacing of the simulation lattice
  const ITER = 4, YIELD = .08, RMIN = .3, RMAX = 3.5;
  const GRAV = 6 / (120 * 120), DC = H * .85, BOARD = .93;

  // ---------- the guy, as a signed distance field (about 1 unit long, lying on y = 0) ----------
  const cap = (x, y, z, ax, ay, az, bx, by, bz, r) => {
    const vx = bx - ax, vy = by - ay, vz = bz - az, wx = x - ax, wy = y - ay, wz = z - az;
    let t = (wx * vx + wy * vy + wz * vz) / (vx * vx + vy * vy + vz * vz);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const dx = wx - vx * t, dy = wy - vy * t, dz = wz - vz * t;
    return Math.sqrt(dx * dx + dy * dy + dz * dz) - r;
  };
  const sph = (x, y, z, ax, ay, az, r) => { const dx = x - ax, dy = y - ay, dz = z - az; return Math.sqrt(dx * dx + dy * dy + dz * dz) - r; };
  const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * .25; };
  function sdf(x, y, z) {
    const K = .045;
    let d = sph(x, y, z, 0, .105, -.345, .105);                              // head
    d = smin(d, cap(x, y, z, 0, .1, -.17, 0, .1, .06, .1), K);               // chest
    d = smin(d, sph(x, y, z, 0, .112, .035, .115), K);                       // belly
    d = smin(d, cap(x, y, z, -.07, .07, -.17, -.33, .045, -.25, .043), K);   // arm, flung up
    d = smin(d, sph(x, y, z, -.35, .055, -.258, .055), K);
    d = smin(d, cap(x, y, z, .07, .07, -.17, .34, .045, -.06, .043), K);     // arm, flopped out
    d = smin(d, sph(x, y, z, .36, .055, -.05, .055), K);
    d = smin(d, cap(x, y, z, -.05, .075, .09, -.15, .056, .4, .055), K);     // legs
    d = smin(d, sph(x, y, z, -.165, .066, .42, .066), K);
    d = smin(d, cap(x, y, z, .05, .075, .09, .19, .056, .37, .055), K);
    d = smin(d, sph(x, y, z, .205, .066, .385, .066), K);
    d += .0035 * Math.sin(31 * x + 1.3) * Math.sin(27 * z + .4) * Math.sin(23 * y + 2.1);  // hand-rolled lumps
    return Math.max(d, -y);                                                  // flat where it meets the board
  }

  // ---------- simulation mesh: tetrahedra on a lattice ----------
  let N = 0, X, PX, HX, LI;             // node positions, previous, home, lattice coords
  let E = 0, ea, eb, er, er0;           // edges with plastic rest lengths
  let NT = 0, tn, tv;                   // tets (4 nodes each) and rest volumes
  let cubeTet, ncx, ncy, ncz;
  const LMIN = [-.5, 0, -.5];

  function buildSim() {
    ncx = Math.ceil(1 / H); ncy = Math.ceil(.26 / H); ncz = Math.ceil(1.04 / H);
    const sx = ncx + 1, sy = ncy + 1, sz = ncz + 1;
    const nid = new Int32Array(sx * sy * sz).fill(-1);
    const xs = [], li = [];
    const node = (i, j, k) => {
      const q = i + sx * (j + sy * k);
      if (nid[q] < 0) { nid[q] = xs.length / 3; xs.push(LMIN[0] + i * H, LMIN[1] + j * H, LMIN[2] + k * H); li.push(i, j, k); }
      return nid[q];
    };
    cubeTet = new Int32Array(ncx * ncy * ncz).fill(-1);
    const KUHN = [[0, 1, 3, 7], [0, 1, 5, 7], [0, 2, 3, 7], [0, 2, 6, 7], [0, 4, 5, 7], [0, 4, 6, 7]];
    const tets = [];
    for (let k = 0; k < ncz; k++) for (let j = 0; j < ncy; j++) for (let i = 0; i < ncx; i++) {
      if (sdf(LMIN[0] + (i + .5) * H, LMIN[1] + (j + .5) * H, LMIN[2] + (k + .5) * H) >= 0) continue;
      const c = [];
      for (let b = 0; b < 8; b++) c.push(node(i + (b & 1), j + ((b >> 1) & 1), k + ((b >> 2) & 1)));
      cubeTet[i + ncx * (j + ncy * k)] = tets.length / 4;
      for (const t of KUHN) tets.push(c[t[0]], c[t[1]], c[t[2]], c[t[3]]);
    }
    N = xs.length / 3;
    X = Float32Array.from(xs); LI = Int16Array.from(li);
    // pull stray lattice corners onto the real surface
    for (let i = 0; i < N; i++) {
      const o = 3 * i;
      for (let n = 0; n < 4; n++) {
        const d = sdf(X[o], X[o + 1], X[o + 2]);
        if (d <= 1e-5) break;
        const e = 1e-4;
        const gx = sdf(X[o] + e, X[o + 1], X[o + 2]) - sdf(X[o] - e, X[o + 1], X[o + 2]);
        const gy = sdf(X[o], X[o + 1] + e, X[o + 2]) - sdf(X[o], X[o + 1] - e, X[o + 2]);
        const gz = sdf(X[o], X[o + 1], X[o + 2] + e) - sdf(X[o], X[o + 1], X[o + 2] - e);
        const gl = Math.sqrt(gx * gx + gy * gy + gz * gz) || 1;
        X[o] -= gx / gl * d; X[o + 1] -= gy / gl * d; X[o + 2] -= gz / gl * d;
        if (X[o + 1] < 0) X[o + 1] = 0;
      }
    }
    PX = Float32Array.from(X); HX = Float32Array.from(X);
    NT = tets.length / 4; tn = Uint16Array.from(tets); tv = new Float32Array(NT);
    for (let t = 0; t < NT; t++) {
      let v = tetVol(tn[4 * t], tn[4 * t + 1], tn[4 * t + 2], tn[4 * t + 3]);
      if (v < 0) { const s = tn[4 * t + 1]; tn[4 * t + 1] = tn[4 * t + 2]; tn[4 * t + 2] = s; v = -v; }
      tv[t] = v;
    }
    const set = new Set();
    const PAIRS = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
    for (let t = 0; t < NT; t++) for (const [p, q] of PAIRS) {
      const a = tn[4 * t + p], b = tn[4 * t + q];
      set.add(a < b ? a * N + b : b * N + a);
    }
    E = set.size; ea = new Uint16Array(E); eb = new Uint16Array(E); er = new Float32Array(E); er0 = new Float32Array(E);
    let n = 0;
    for (const key of set) {
      const a = Math.floor(key / N), b = key % N;
      ea[n] = a; eb[n] = b;
      er0[n] = er[n] = Math.hypot(X[3 * b] - X[3 * a], X[3 * b + 1] - X[3 * a + 1], X[3 * b + 2] - X[3 * a + 2]);
      n++;
    }
  }
  function tetVol(a, b, c, d) {
    a *= 3; b *= 3; c *= 3; d *= 3;
    const x1 = X[b] - X[a], y1 = X[b + 1] - X[a + 1], z1 = X[b + 2] - X[a + 2];
    const x2 = X[c] - X[a], y2 = X[c + 1] - X[a + 1], z2 = X[c + 2] - X[a + 2];
    const x3 = X[d] - X[a], y3 = X[d + 1] - X[a + 1], z3 = X[d + 2] - X[a + 2];
    return ((y1 * z2 - z1 * y2) * x3 + (z1 * x2 - x1 * z2) * y3 + (x1 * y2 - y1 * x2) * z3) / 6;
  }

  // ---------- visible skin: surface nets over the same field, bound to the tets ----------
  let SV = 0, skinPos, skinUV, skinIdx, bindN, bindW;

  function buildSkin() {
    const c = .0085, min = [-.5, -2 * c, -.5];
    const nx = Math.ceil(1 / c) + 1, ny = Math.ceil(.27 / c) + 1, nz = Math.ceil(1.04 / c) + 1;
    const val = new Float32Array(nx * ny * nz);
    for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++)
      val[i + nx * (j + ny * k)] = sdf(min[0] + i * c, min[1] + j * c, min[2] + k * c);
    const cellV = new Int32Array(nx * ny * nz).fill(-1);
    const pos = [];
    const EDGES = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];
    const cvv = new Float32Array(8);
    for (let k = 0; k < nz - 1; k++) for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const q = i + nx * (j + ny * k);
      let neg = 0;
      for (let b = 0; b < 8; b++) { cvv[b] = val[q + (b & 1) + nx * (((b >> 1) & 1) + ny * ((b >> 2) & 1))]; if (cvv[b] < 0) neg++; }
      if (neg === 0 || neg === 8) continue;
      let ax = 0, ay = 0, az = 0, n = 0;
      for (const [a, b] of EDGES) {
        const va = cvv[a], vb = cvv[b];
        if ((va < 0) === (vb < 0)) continue;
        const t = va / (va - vb);
        ax += (a & 1) + ((b & 1) - (a & 1)) * t;
        ay += ((a >> 1) & 1) + (((b >> 1) & 1) - ((a >> 1) & 1)) * t;
        az += ((a >> 2) & 1) + (((b >> 2) & 1) - ((a >> 2) & 1)) * t;
        n++;
      }
      cellV[q] = pos.length / 3;
      pos.push(min[0] + (i + ax / n) * c, min[1] + (j + ay / n) * c, min[2] + (k + az / n) * c);
    }
    const idx = [];
    const quad = (a, b, cc, d, flip) => {
      if (a < 0 || b < 0 || cc < 0 || d < 0) return;
      if (flip) idx.push(a, cc, b, a, d, cc); else idx.push(a, b, cc, a, cc, d);
    };
    const C = (i, j, k) => cellV[i + nx * (j + ny * k)];
    for (let k = 1; k < nz - 1; k++) for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
      const q = i + nx * (j + ny * k), v0 = val[q] < 0;
      if (v0 !== (val[q + 1] < 0)) quad(C(i, j, k), C(i, j - 1, k), C(i, j - 1, k - 1), C(i, j, k - 1), v0);
      if (v0 !== (val[q + nx] < 0)) quad(C(i, j, k), C(i, j, k - 1), C(i - 1, j, k - 1), C(i - 1, j, k), v0);
      if (v0 !== (val[q + nx * ny] < 0)) quad(C(i, j, k), C(i - 1, j, k), C(i - 1, j - 1, k), C(i, j - 1, k), v0);
    }
    SV = pos.length / 3;
    skinPos = Float32Array.from(pos); skinIdx = Uint32Array.from(idx);
    // make sure faces point outward
    {
      const a = 3 * idx[0], b = 3 * idx[1], d = 3 * idx[2];
      const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
      const vx = pos[d] - pos[a], vy = pos[d + 1] - pos[a + 1], vz = pos[d + 2] - pos[a + 2];
      const nx_ = uy * vz - uz * vy, ny_ = uz * vx - ux * vz, nz_ = ux * vy - uy * vx;
      const l = Math.hypot(nx_, ny_, nz_) || 1, e = .004;
      const mx = (pos[a] + pos[b] + pos[d]) / 3, my = (pos[a + 1] + pos[b + 1] + pos[d + 1]) / 3, mz = (pos[a + 2] + pos[b + 2] + pos[d + 2]) / 3;
      if (sdf(mx + nx_ / l * e, my + ny_ / l * e, mz + nz_ / l * e) < sdf(mx - nx_ / l * e, my - ny_ / l * e, mz - nz_ / l * e))
        for (let t = 0; t < skinIdx.length; t += 3) { const s = skinIdx[t + 1]; skinIdx[t + 1] = skinIdx[t + 2]; skinIdx[t + 2] = s; }
    }
    // top-down projection for the painted face and the surface grain
    skinUV = new Float32Array(SV * 2);
    for (let v = 0; v < SV; v++) { skinUV[2 * v] = (pos[3 * v] + .55) / 1.1; skinUV[2 * v + 1] = 1 - (pos[3 * v + 2] + .55) / 1.1; }

    // bind every skin vertex to the tet that holds it best
    bindN = new Uint16Array(SV * 4); bindW = new Float32Array(SV * 4);
    const w = [0, 0, 0, 0], minVol = H * H * H / 6 * .05;
    for (let v = 0; v < SV; v++) {
      const qx = pos[3 * v], qy = pos[3 * v + 1], qz = pos[3 * v + 2];
      const ci = Math.floor((qx - LMIN[0]) / H), cj = Math.floor((qy - LMIN[1]) / H), ck = Math.floor((qz - LMIN[2]) / H);
      let best = -1e9, bt = -1;
      for (let reach = 1; reach <= 3 && bt < 0; reach++)
        for (let k = ck - reach; k <= ck + reach; k++) for (let j = cj - reach; j <= cj + reach; j++) for (let i = ci - reach; i <= ci + reach; i++) {
          if (i < 0 || j < 0 || k < 0 || i >= ncx || j >= ncy || k >= ncz) continue;
          const t0 = cubeTet[i + ncx * (j + ncy * k)];
          if (t0 < 0) continue;
          for (let t = t0; t < t0 + 6; t++) {
            if (tv[t] < minVol) continue;
            bary(t, qx, qy, qz, w);
            const s = Math.min(w[0], w[1], w[2], w[3]);
            if (s > best) { best = s; bt = t; }
          }
        }
      if (bt < 0) bt = 0;
      bary(bt, qx, qy, qz, w);
      for (let n = 0; n < 4; n++) { bindN[4 * v + n] = tn[4 * bt + n]; bindW[4 * v + n] = w[n]; }
    }
  }
  function bary(t, qx, qy, qz, w) {
    const a = 3 * tn[4 * t], b = 3 * tn[4 * t + 1], c = 3 * tn[4 * t + 2], d = 3 * tn[4 * t + 3];
    const x1 = X[b] - X[a], y1 = X[b + 1] - X[a + 1], z1 = X[b + 2] - X[a + 2];

    const p = ptrs.get(e.pointerId);
    if (p && p.mesh) scene.remove(p.mesh);
    ptrs.delete(e.pointerId);
    lastTouch = performance.now(); needRender = true;
    if (![...ptrs.values()].some(q => q.mode !== 'orbit')) cv.classList.remove('holding');
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    cam.zoom = Math.min(1.9, Math.max(.5, cam.zoom * Math.exp(e.deltaY * .0012)));
    placeCamera();
  }, { passive: false });

  // ---------- controls ----------
  function setTool(t) {
    tool = t;
    for (const b of document.querySelectorAll('.tools button')) b.setAttribute('aria-checked', String(b.dataset.tool === t));
  }
  for (const b of document.querySelectorAll('.tools button')) b.addEventListener('click', () => setTool(b.dataset.tool));

  function reset() { lastTouch = performance.now(); resetT = 110; wake(); cam.az = .35; cam.pol = .78; cam.zoom = 1; placeCamera(); }
  $('reset-btn').addEventListener('click', reset);

  $('tune-btn').addEventListener('click', () => {
    const open = $('panel').hidden;
    $('panel').hidden = !open;
    $('tune-btn').setAttribute('aria-expanded', String(open));
  });
  for (const k of ['soft', 'mem', 'slide', 'finger']) {
    const el = $(k), sync = () => { P[k] = el.value / 100; $(k + '-out').value = el.value; wake(); };
    el.addEventListener('input', sync); sync();
  }
  $('mesh-btn').addEventListener('click', () => {
    P.mesh = !P.mesh; $('mesh-btn').setAttribute('aria-pressed', String(P.mesh));
    clay.wireframe = P.mesh; needRender = true;
  });
  $('clay-btn').addEventListener('click', () => {
    P.dark = !P.dark; $('clay-btn').setAttribute('aria-pressed', String(P.dark));
  });
  $('invert-btn').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    readColors();
  });
  window.addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === '1') setTool('pull'); else if (k === '2') setTool('press'); else if (k === '3') setTool('pinch');
    else if (k === 'r') reset();
  });

  window.addEventListener('resize', resize);
  resize(); readColors();
  window.plasticGuy = { stats: () => { let top = 0; for (let i = 1; i < 3 * N; i += 3) if (X[i] > top) top = X[i]; return { nodes: N, edges: E, tets: NT, skin: SV, top, asleep, moved: lastMoved }; } };
  requestAnimationFrame(frame);
})();
</script>
</body>
