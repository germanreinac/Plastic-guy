<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plastic Guy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed 3D stage. The guy lies on a round board in the middle; controls sit in the corners. */
:root {
  --bg: #ffffff;
  --fg: #0b0b0b;
  --mute: rgba(11, 11, 11, .5);
  --line: rgba(11, 11, 11, .16);
  --disc: #ecece9;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --fg: #f6f6f6;
    --mute: rgba(246, 246, 246, .55); --line: rgba(246, 246, 246, .2); --disc: #2a2a2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0b; --fg: #f6f6f6;
  --mute: rgba(246, 246, 246, .55); --line: rgba(246, 246, 246, .2); --disc: #2a2a2a;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 11px/1.4 var(--mono);
  overflow: hidden;
  padding-left: var(--gl);
  padding-right: var(--gr);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: default;
}
#stage.holding { cursor: grabbing; }

.top {
  position: fixed; inset: 0 0 auto 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gr) 0 var(--gl);
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.top { align-items: flex-start; }
.left { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-top: 8px; }
.mark {
  margin: 0;
  font: 700 17px/1 var(--display);
  letter-spacing: -.02em;
}
.actions { display: flex; gap: 6px; }

button {
  font: 500 11px/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--fg);
  border-radius: 999px;
  padding: 9px 13px;
  cursor: pointer;
}
button[aria-pressed="true"], button[aria-expanded="true"], button[aria-checked="true"] {
  background: var(--fg); color: var(--bg);
}
@media (hover: hover) { button:hover { background: var(--fg); color: var(--bg); } }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.seg {
  display: flex;
  border: 1px solid var(--fg);
  border-radius: 999px;
  background: var(--bg);
  padding: 3px; gap: 2px;
}
.seg button { border-color: transparent; padding: 9px 16px; }
.modes button { padding: 7px 12px; }
.tools {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
}
#palette {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px;
}
.swatch, .swatch:hover, .swatch[aria-pressed="true"] {
  width: 28px; height: 28px; padding: 0;
  background: var(--c);
  border: 1px solid var(--fg);
}
.swatch[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
#undo-btn { margin-left: 6px; }
body.create #hint { bottom: calc(116px + env(safe-area-inset-bottom, 0px)); }

#hint {
  position: fixed; left: 0; right: 0;
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding: 0 var(--gr) 0 var(--gl);
  text-align: center;
  color: var(--mute);
  letter-spacing: .08em; text-transform: uppercase;
  pointer-events: none;
  transition: opacity .6s;
}
#hint.gone { opacity: 0; }

#panel {
  position: fixed;
  top: calc(66px + env(safe-area-inset-top, 0px));
  right: var(--gr);
  width: min(236px, calc(100vw - 32px));
  box-sizing: border-box;
  background: var(--bg);
  border: 1px solid var(--fg);
  border-radius: 18px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: baseline; }
.row label { letter-spacing: .08em; text-transform: uppercase; }
.row output { color: var(--mute); font-variant-numeric: tabular-nums; }
.row input { grid-column: 1 / -1; }
.ends { grid-column: 1 / -1; display: flex; justify-content: space-between; color: var(--mute); font-size: 10px; }
.switches { display: flex; gap: 6px; padding-top: 2px; }
.switches button { flex: 1; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 18px; margin: 0;
  background: transparent; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--fg); }
input[type="range"]::-moz-range-track { height: 1px; background: var(--fg); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; margin-top: -8px;
  border-radius: 50%; background: var(--fg); border: 0;
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; background: var(--fg); border: 0;
}

@media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="A clay figure lying on the floor. Drag it to shape it."></canvas>

<header class="top">
  <div class="left">
    <h1 class="mark">plastic guy</h1>
    <div class="seg modes" role="radiogroup" aria-label="Mode" hidden>
      <button type="button" role="radio" aria-checked="true" data-mode="toy" id="mode-toy">Toy</button>
      <button type="button" role="radio" aria-checked="false" data-mode="create" id="mode-create">Create</button>
    </div>
  </div>
  <div class="actions" style="padding-top:8px">
    <button id="tune-btn" type="button" aria-expanded="false" aria-controls="panel">Tune</button>
    <button id="reset-btn" type="button">Reset</button>
  </div>
</header>

<section id="panel" aria-label="Putty settings" hidden>
  <div class="row">
    <label for="soft">Softness</label><output id="soft-out" for="soft">35</output>
    <input id="soft" type="range" min="0" max="100" value="35">
    <div class="ends"><span>firm</span><span>gooey</span></div>
  </div>
  <div class="row">
    <label for="mem">Spring back</label><output id="mem-out" for="mem">0</output>
    <input id="mem" type="range" min="0" max="100" value="0">
    <div class="ends"><span>clay</span><span>rubber</span></div>
  </div>
  <div class="row">
    <label for="slide">Slide</label><output id="slide-out" for="slide">15</output>
    <input id="slide" type="range" min="0" max="100" value="15">
    <div class="ends"><span>sticky</span><span>slippery</span></div>
  </div>
  <div class="row">
    <label for="finger">Finger size</label><output id="finger-out" for="finger">50</output>
    <input id="finger" type="range" min="0" max="100" value="50">
    <div class="ends"><span>fingertip</span><span>whole palm</span></div>
  </div>
  <div class="switches">
    <button id="mesh-btn" type="button" aria-pressed="false">Mesh</button>
    <button id="clay-btn" type="button" aria-pressed="false">Dark clay</button>
  </div>
  <div class="switches">
    <button id="invert-btn" type="button">Invert room</button>
  </div>
</section>

<p id="hint">Drag the guy to shape him.</p>

<div id="palette" hidden>
  <button type="button" class="swatch" style="--c:#d8d7d2" data-shade="0" id="shade-0" aria-pressed="true" aria-label="White clay"></button>
  <button type="button" class="swatch" style="--c:#7f7f7c" data-shade="1" id="shade-1" aria-pressed="false" aria-label="Grey clay"></button>
  <button type="button" class="swatch" style="--c:#262626" data-shade="2" id="shade-2" aria-pressed="false" aria-label="Black clay"></button>
  <button type="button" id="undo-btn">Undo</button>
</div>

<nav class="seg tools" role="radiogroup" aria-label="Tool">
  <button type="button" role="radio" aria-checked="false" data-tool="add" id="tool-add" hidden>Add</button>
  <button type="button" role="radio" aria-checked="true" data-tool="pull" id="tool-pull">Pull</button>
  <button type="button" role="radio" aria-checked="false" data-tool="press" id="tool-press">Press</button>
  <button type="button" role="radio" aria-checked="false" data-tool="pinch" id="tool-pinch">Pinch</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('stage');
  if (!window.THREE) { $('hint').textContent = 'Could not load the 3D engine. Check your connection and reload.'; return; }
  const T3 = window.THREE;

  // ---------- settings ----------
  const P = { soft: .35, mem: 0, slide: .15, finger: .5, mesh: false, dark: false };
  let mode = 'toy', tool = 'pull', shade = 0;
  const H = .028;                       // spacing of the simulation lattice
  const ITER = 5, YIELD = .1, RMIN = .4, RMAX = 3;
  const GRAV = 2.5 / (120 * 120), DC = H * .85, BOARD = .93;
  const WELD = DC * 1.03, WELD_BREAK = WELD * 2.4;       // clay sticks on contact, tears off if yanked
  const CAPN = 12000, CAPE = 80000, CAPT = 56000, MAXN = 9000;

  // ---------- shapes as signed distance fields (lying on y = 0) ----------
  const cap = (x, y, z, ax, ay, az, bx, by, bz, r) => {
    const vx = bx - ax, vy = by - ay, vz = bz - az, wx = x - ax, wy = y - ay, wz = z - az;
    let t = (wx * vx + wy * vy + wz * vz) / (vx * vx + vy * vy + vz * vz);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const dx = wx - vx * t, dy = wy - vy * t, dz = wz - vz * t;
    return Math.sqrt(dx * dx + dy * dy + dz * dz) - r;
  };
  const sph = (x, y, z, ax, ay, az, r) => { const dx = x - ax, dy = y - ay, dz = z - az; return Math.sqrt(dx * dx + dy * dy + dz * dz) - r; };
  const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * .25; };
  const lumps = (x, y, z) => .0035 * Math.sin(31 * x + 1.3) * Math.sin(27 * z + .4) * Math.sin(23 * y + 2.1);  // hand-rolled look

  const guyField = {
    min: [-.5, 0, -.5], max: [.5, .26, .54], incl: .45 * H,
    sdf(x, y, z) {
      const K = .045;
      let d = sph(x, y, z, 0, .105, -.345, .105);                              // head
      d = smin(d, cap(x, y, z, 0, .1, -.17, 0, .1, .06, .1), K);               // chest
      d = smin(d, sph(x, y, z, 0, .112, .035, .115), K);                       // belly
      d = smin(d, cap(x, y, z, -.07, .07, -.17, -.33, .045, -.25, .043), K);   // arm, flung up
      d = smin(d, sph(x, y, z, -.35, .055, -.258, .055), K);
      d = smin(d, cap(x, y, z, .07, .07, -.17, .34, .045, -.06, .043), K);     // arm, flopped out
      d = smin(d, sph(x, y, z, .36, .055, -.05, .055), K);
      d = smin(d, cap(x, y, z, -.05, .075, .09, -.15, .056, .4, .055), K);     // legs
      d = smin(d, sph(x, y, z, -.165, .066, .42, .066), K);
      d = smin(d, cap(x, y, z, .05, .075, .09, .19, .056, .37, .055), K);
      d = smin(d, sph(x, y, z, .205, .066, .385, .066), K);
      return Math.max(d + lumps(x, y, z), -y);                                 // flat where it meets the board
    },
  };

  // a finger stroke becomes a rope of clay; segments are bucketed so the field stays cheap to sample
  function strokeField(path, r) {
    const B = .08, PAD = .03, buckets = new Map(), segs = [];
    const pts = path.length > 1 ? path : [path[0], path[0].clone().add(new T3.Vector3(.002, 0, 0))];
    const min = [1e9, 1e9, 1e9], max = [-1e9, -1e9, -1e9];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], s = [a.x, a.y, a.z, b.x, b.y, b.z];
      segs.push(s);
      const m = r + PAD;
      for (let bi = Math.floor((Math.min(a.x, b.x) - m) / B); bi <= Math.floor((Math.max(a.x, b.x) + m) / B); bi++)
        for (let bk = Math.floor((Math.min(a.z, b.z) - m) / B); bk <= Math.floor((Math.max(a.z, b.z) + m) / B); bk++) {
          const k = (bi + 2048) * 4096 + bk + 2048;
          if (!buckets.has(k)) buckets.set(k, []);
          buckets.get(k).push(s);
        }
      for (const q of [a, b]) {
        min[0] = Math.min(min[0], q.x); min[1] = Math.min(min[1], q.y); min[2] = Math.min(min[2], q.z);
        max[0] = Math.max(max[0], q.x); max[1] = Math.max(max[1], q.y); max[2] = Math.max(max[2], q.z);
      }
    }
    const e = r + .012;
    return {
      min: [min[0] - e, Math.max(0, min[1] - e), min[2] - e], max: [max[0] + e, max[1] + e, max[2] + e], incl: .45 * H,
      sdf(x, y, z) {
        const l = buckets.get((Math.floor(x / B) + 2048) * 4096 + Math.floor(z / B) + 2048);
        let d = PAD;
        if (l) for (const s of l) { const c = cap(x, y, z, s[0], s[1], s[2], s[3], s[4], s[5], r); if (c < d) d = c; }
        return Math.max(d + lumps(x, y, z), -y);
      },
    };
  }

  // ---------- worlds: the toy and the creative board each keep their own clay ----------
  const newWorld = () => ({
    N: 0, E: 0, NT: 0,
    X: new Float32Array(3 * CAPN), PX: new Float32Array(3 * CAPN), HX: new Float32Array(3 * CAPN),
    LI: new Int16Array(3 * CAPN), PI: new Uint16Array(CAPN),
    ea: new Uint32Array(CAPE), eb: new Uint32Array(CAPE), er: new Float32Array(CAPE), er0: new Float32Array(CAPE),
    tn: new Uint32Array(4 * CAPT), tv: new Float32Array(CAPT),
    tL: new Float32Array(6 * CAPT), tL2: new Float32Array(6 * CAPT), tL20: new Float32Array(6 * CAPT),
    pieces: [], wa: [], wb: [], wkey: new Set(), wcnt: new Uint8Array(CAPN),
  });
  const worlds = { toy: newWorld(), create: newWorld() };
  let W, N = 0, E = 0, NT = 0, X, PX, HX, LI, PI, ea, eb, er, er0, tn, tv, tL, tL2, tL20;
  const EP0 = [0, 0, 0, 1, 1, 2], EP1 = [1, 2, 3, 2, 3, 3];
  function useWorld(w) { W = w; ({ N, E, NT, X, PX, HX, LI, PI, ea, eb, er, er0, tn, tv, tL, tL2, tL20 } = w); }
  function saveCounts() { W.N = N; W.E = E; W.NT = NT; }
  useWorld(worlds.toy);

  function tetVol(a, b, c, d) {
    a *= 3; b *= 3; c *= 3; d *= 3;
    const x1 = X[b] - X[a], y1 = X[b + 1] - X[a + 1], z1 = X[b + 2] - X[a + 2];
    const x2 = X[c] - X[a], y2 = X[c + 1] - X[a + 1], z2 = X[c + 2] - X[a + 2];
    const x3 = X[d] - X[a], y3 = X[d + 1] - X[a + 1], z3 = X[d + 2] - X[a + 2];
    return ((y1 * z2 - z1 * y2) * x3 + (z1 * x2 - x1 * z2) * y3 + (x1 * y2 - y1 * x2) * z3) / 6;
  }
  function bary(t, qx, qy, qz, w) {
    const a = 3 * tn[4 * t], b = 3 * tn[4 * t + 1], c = 3 * tn[4 * t + 2], d = 3 * tn[4 * t + 3];
    const x1 = X[b] - X[a], y1 = X[b + 1] - X[a + 1], z1 = X[b + 2] - X[a + 2];
    const x2 = X[c] - X[a], y2 = X[c + 1] - X[a + 1], z2 = X[c + 2] - X[a + 2];
    const x3 = X[d] - X[a], y3 = X[d + 1] - X[a + 1], z3 = X[d + 2] - X[a + 2];
    const px = qx - X[a], py = qy - X[a + 1], pz = qz - X[a + 2];
    const det = (y1 * z2 - z1 * y2) * x3 + (z1 * x2 - x1 * z2) * y3 + (x1 * y2 - y1 * x2) * z3;
    w[1] = ((y2 * z3 - z2 * y3) * px + (z2 * x3 - x2 * z3) * py + (x2 * y3 - y2 * x3) * pz) / det;
    w[2] = ((y3 * z1 - z3 * y1) * px + (z3 * x1 - x3 * z1) * py + (x3 * y1 - y3 * x1) * pz) / det;
    w[3] = ((y1 * z2 - z1 * y2) * px + (z1 * x2 - x1 * z2) * py + (x1 * y2 - y1 * x2) * pz) / det;
    w[0] = 1 - w[1] - w[2] - w[3];
  }

  // Turn a field into a piece of clay: tetrahedra on a lattice for the physics,
  // and a smooth surface-nets skin bound to those tetrahedra for the eye.
  function buildPiece(f, material) {
    const n0 = N, e0 = E, t0 = NT, sdf = f.sdf, pid = W.pieces.length;
    const fail = () => { N = n0; E = e0; NT = t0; return null; };
    const L0 = [Math.floor(f.min[0] / H) * H, Math.max(0, Math.floor(f.min[1] / H) * H), Math.floor(f.min[2] / H) * H];
    const ncx = Math.max(1, Math.ceil((f.max[0] - L0[0]) / H)), ncy = Math.max(1, Math.ceil((f.max[1] - L0[1]) / H)), ncz = Math.max(1, Math.ceil((f.max[2] - L0[2]) / H));
    const sx = ncx + 1, sy = ncy + 1;
    const nid = new Int32Array(sx * sy * (ncz + 1)).fill(-1);
    const node = (i, j, k) => {
      const q = i + sx * (j + sy * k);
      if (nid[q] < 0) {
        if (N >= CAPN) return -1;
        nid[q] = N; X[3 * N] = L0[0] + i * H; X[3 * N + 1] = L0[1] + j * H; X[3 * N + 2] = L0[2] + k * H;
        LI[3 * N] = i; LI[3 * N + 1] = j; LI[3 * N + 2] = k; PI[N] = pid; W.wcnt[N] = 0; N++;
      }
      return nid[q];
    };
    const cubeTet = new Int32Array(ncx * ncy * ncz).fill(-1);
    const KUHN = [[0, 1, 3, 7], [0, 1, 5, 7], [0, 2, 3, 7], [0, 2, 6, 7], [0, 4, 5, 7], [0, 4, 6, 7]];
    const c8 = new Int32Array(8);
    for (let k = 0; k < ncz; k++) for (let j = 0; j < ncy; j++) for (let i = 0; i < ncx; i++) {
      if (sdf(L0[0] + (i + .5) * H, L0[1] + (j + .5) * H, L0[2] + (k + .5) * H) >= f.incl) continue;
      if (NT + 6 > CAPT) return fail();
      for (let b = 0; b < 8; b++) { c8[b] = node(i + (b & 1), j + ((b >> 1) & 1), k + ((b >> 2) & 1)); if (c8[b] < 0) return fail(); }
      cubeTet[i + ncx * (j + ncy * k)] = NT;
      for (const t of KUHN) { tn[4 * NT] = c8[t[0]]; tn[4 * NT + 1] = c8[t[1]]; tn[4 * NT + 2] = c8[t[2]]; tn[4 * NT + 3] = c8[t[3]]; NT++; }
    }
    if (NT === t0) return fail();
    // the cells form a cage just outside the skin, so the skin is carried by them, never extrapolated;
    // corners that stick out too far are pulled in to half a cell from the surface
    for (let i = n0; i < N; i++) {
      const o = 3 * i;
      for (let n = 0; n < 4; n++) {
        const d = sdf(X[o], X[o + 1], X[o + 2]) - .5 * H;
        if (d <= 1e-5) break;
        const e = 1e-4;
        const gx = sdf(X[o] + e, X[o + 1], X[o + 2]) - sdf(X[o] - e, X[o + 1], X[o + 2]);
        const gy = sdf(X[o], X[o + 1] + e, X[o + 2]) - sdf(X[o], X[o + 1] - e, X[o + 2]);
        const gz = sdf(X[o], X[o + 1], X[o + 2] + e) - sdf(X[o], X[o + 1], X[o + 2] - e);
        const gl = Math.sqrt(gx * gx + gy * gy + gz * gz) || 1;
        X[o] -= gx / gl * d; X[o + 1] -= gy / gl * d; X[o + 2] -= gz / gl * d;
        if (X[o + 1] < 0) X[o + 1] = 0;
      }
    }
    for (let o = 3 * n0; o < 3 * N; o++) PX[o] = HX[o] = X[o];
    for (let t = t0; t < NT; t++) {
      let v = tetVol(tn[4 * t], tn[4 * t + 1], tn[4 * t + 2], tn[4 * t + 3]);
      if (v < 0) { const s = tn[4 * t + 1]; tn[4 * t + 1] = tn[4 * t + 2]; tn[4 * t + 2] = s; v = -v; }

      const s2 = Math.pow(v0 / v, 2 / 3), o = 6 * t;
      let dev = 0;
      for (let k = 0; k < 6; k++) {
        const a = 3 * tn[4 * t + EP0[k]], b = 3 * tn[4 * t + EP1[k]];
        const dx = X[b] - X[a], dy = X[b + 1] - X[a + 1], dz = X[b + 2] - X[a + 2];
        l2[k] = (dx * dx + dy * dy + dz * dz) * s2;
        const e = Math.abs(l2[k] - tL2[o + k]) / tL2[o + k];
        if (e > dev) dev = e;
      }
      const flow = dev > Y2 ? rate * (1 - Y2 / dev) : 0;
      if (!flow && !ret) continue;
      for (let k = 0; k < 6; k++) {
        let r = tL2[o + k];
        r += (l2[k] - r) * flow;
        const r0 = tL20[o + k];
        r += (r0 - r) * ret;
        r = r < r0 * RMIN * RMIN ? r0 * RMIN * RMIN : r > r0 * RMAX * RMAX ? r0 * RMAX * RMAX : r;
        tL2[o + k] = r; tL[o + k] = Math.sqrt(r);
      }
    }
    for (let n = wa.length - 1; n >= 0; n--) {
      const a = 3 * wa[n], b = 3 * wb[n];
      const dx = X[b] - X[a], dy = X[b + 1] - X[a + 1], dz = X[b + 2] - X[a + 2];
      if (dx * dx + dy * dy + dz * dz > WELD_BREAK * WELD_BREAK) unweld(n);
    }

    if (resetT > 0) {
      resetT--;
      for (let o = 0; o < 3 * N; o++) { const d = (HX[o] - X[o]) * .1; X[o] += d; PX[o] += d; }
      for (let k = 0; k < 6 * NT; k++) { tL2[k] += (tL20[k] - tL2[k]) * .2; tL[k] = Math.sqrt(tL2[k]); }
    }

    let moved = 0;
    for (let o = 0; o < 3 * N; o++) { const d = X[o] - PX[o]; if (d > moved) moved = d; else if (-d > moved) moved = -d; }
    lastMoved = moved;
    calm = (moved < SLEEP && !ptrs.size && resetT === 0) ? calm + 1 : 0;
    if (calm > 120) asleep = true;
  }
  const wake = () => { asleep = false; calm = 0; };

  // ---------- scene ----------
  const renderer = new T3.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T3.PCFSoftShadowMap;
  const scene = new T3.Scene();
  const camera = new T3.PerspectiveCamera(32, 1, .1, 30);
  const cam = { az: .35, pol: .78, zoom: 1, fit: 2.4 };
  const target = new T3.Vector3(0, .05, .02);
  let needRender = true;

  scene.add(new T3.HemisphereLight(0xffffff, 0x9a9a9a, 1.25));
  const key = new T3.DirectionalLight(0xffffff, 2.1);
  key.position.set(-1.1, 2.4, 1.0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -1.2, right: 1.2, top: 1.2, bottom: -1.2, near: .5, far: 6 });
  key.shadow.bias = -.0004; key.shadow.normalBias = .01; key.shadow.radius = 6;
  scene.add(key);
  const fill = new T3.DirectionalLight(0xffffff, .45); fill.position.set(1.6, .9, -.6); scene.add(fill);

  // flat background: the floor only shows the shadow
  const floor = new T3.Mesh(new T3.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new T3.ShadowMaterial({ opacity: .26 }));
  floor.receiveShadow = true;
  scene.add(floor);

  // matte clay; the face is drawn by maths in the shader, so nothing smears when the clay stretches
  const SHADES = ['#e6e5e0', '#8d8d8a', '#2b2b2b'];
  const faceU = { uFace: { value: 0 }, uInk: { value: new T3.Color('#111111') } };
  const guyMat = new T3.MeshStandardMaterial({ color: SHADES[0], roughness: .95, metalness: 0 });
  guyMat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, faceU);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec3 rest;\nvarying vec3 vRest;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvRest = rest;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vRest; uniform float uFace; uniform vec3 uInk;
        float sdSeg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0., 1.)); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        {
          vec2 p = vRest.xz;
          vec2 e = vec2(abs(p.x) - .04, p.y + .36);
          float d;
          if (uFace > 1.5) d = sdSeg(e, vec2(-.014, 0.), vec2(.014, 0.)) - .004;                 // asleep
          else d = length(e) - (uFace > .5 ? .017 : .0125);
          if (uFace > .5 && uFace < 1.5) d = min(d, length(p - vec2(0., -.3)) - .015);          // held: "o"
          else {
            float arc = max(abs(length(p - vec2(0., -.3345)) - .0375) - .0045, -.312 - p.y);    // smile
            d = min(d, min(arc, length(vec2(abs(p.x) - .03, p.y + .312)) - .0045));
          }
          float aa = max(fwidth(d), 1e-5);
          float m = (1. - smoothstep(-aa, aa, d)) * step(.12, vRest.y);
          diffuseColor.rgb = mix(diffuseColor.rgb, uInk, m);
        }`);
  };
  const shadeMats = SHADES.map(c => new T3.MeshStandardMaterial({ color: c, roughness: .95, metalness: 0 }));
  const allMats = [guyMat, ...shadeMats];
  function paintFace(state) {
    faceU.uFace.value = state === 'held' ? 1 : state === 'asleep' ? 2 : 0;
  }
  let lastFace = '';
  function applyClay() {
    guyMat.color.set(P.dark ? SHADES[2] : SHADES[0]);
    faceU.uInk.value.set(P.dark ? '#f4f4f4' : '#111111');
    needRender = true;
  }

  buildPiece(guyField, guyMat);
  saveCounts();
  paintFace('awake');

  const ballGeo = new T3.SphereGeometry(1, 24, 16);
  const fingerMat = new T3.MeshStandardMaterial({ color: 0x9a9a9a, transparent: true, opacity: .28, roughness: .5, depthWrite: false });

  function skin() {
    for (const p of W.pieces) {
      const { SV, skinPos, bindN, bindW } = p;
      for (let v = 0; v < SV; v++) {
        const q = 4 * v, a = 3 * bindN[q], b = 3 * bindN[q + 1], c = 3 * bindN[q + 2], d = 3 * bindN[q + 3];
        const wa = bindW[q], wb = bindW[q + 1], wc = bindW[q + 2], wd = bindW[q + 3];
        skinPos[3 * v] = X[a] * wa + X[b] * wb + X[c] * wc + X[d] * wd;
        skinPos[3 * v + 1] = X[a + 1] * wa + X[b + 1] * wb + X[c + 1] * wc + X[d + 1] * wd;
        skinPos[3 * v + 2] = X[a + 2] * wa + X[b + 2] * wb + X[c + 2] * wc + X[d + 2] * wd;
      }
      relax(p);
      p.posAttr.needsUpdate = true;
      p.geo.computeVertexNormals();
    }
  }

  function placeCamera() {
    const d = cam.fit * cam.zoom, s = Math.sin(cam.pol);
    camera.position.set(target.x + d * s * Math.sin(cam.az), target.y + d * Math.cos(cam.pol), target.z + d * s * Math.cos(cam.az));
    camera.lookAt(target);
    needRender = true;
  }
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const bg = cs.getPropertyValue('--bg').trim() || '#fff';
    if (readColors.last === bg) return;
    readColors.last = bg;
    const col = new T3.Color(bg);
    readColors.dark = col.r + col.g + col.b < 1.5;
    renderer.setClearColor(col, 1);
    applyClay();
  }
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const t = Math.tan(camera.fov * Math.PI / 360);
    cam.fit = Math.max(.66 / t, .56 / (t * camera.aspect));
    camera.updateProjectionMatrix();
    placeCamera();
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0, frameNo = 0, lastTouch = last;
  function frame(now) {
    acc += Math.min(50, now - last); last = now;
    if (asleep || !N) acc = 0;
    let n = 0;
    while (acc >= 1000 / 120 && n < 3) { step(1 / 120); acc -= 1000 / 120; n++; }
    if (n === 3) acc = 0;
    if (frameNo++ % 30 === 0) readColors();
    if (mode === 'toy') {
      const f = [...ptrs.values()].some(p => p.mode !== 'orbit') ? 'held' : now - lastTouch > 9000 ? 'asleep' : 'awake';
      if (f !== lastFace) { lastFace = f; paintFace(f); needRender = true; }
    }
    if (n) { skin(); needRender = true; }
    for (const p of ptrs.values()) if (p.mesh) { p.mesh.position.copy(p.c); p.mesh.scale.setScalar(fingerR()); }
    if (needRender) { renderer.render(scene, camera); needRender = false; }
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  const ray = new T3.Raycaster(), ndc = new T3.Vector2(), tmpV = new T3.Vector3();
  const setRay = e => {
    const r = cv.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
  };
  const hitClay = () => ray.intersectObjects(W.pieces.map(p => p.mesh), false)[0];
  const say = text => { const h = $('hint'); h.textContent = text; h.classList.remove('gone'); };

  // where a new bit of clay would land under the pointer: on top of clay, or on the board
  function landing(r) {
    const hit = hitClay();
    if (hit) return new T3.Vector3(hit.point.x, hit.point.y + r * .85, hit.point.z);
    const t = -ray.ray.origin.y / ray.ray.direction.y;
    if (!(t > 0)) return null;
    const q = ray.ray.at(t, new T3.Vector3());
    if (q.x * q.x + q.z * q.z > (BOARD - r) * (BOARD - r)) return null;
    q.y = r * .8;
    return q;
  }
  function extendStroke(p, q) {
    if (p.path.length >= 90 || q.distanceTo(p.path[p.path.length - 1]) < p.r * .5) return;
    p.path.push(q);
    const m = new T3.Mesh(ballGeo, shadeMats[shade]); m.position.copy(q); m.scale.setScalar(p.r); m.castShadow = true;
    p.preview.add(m); needRender = true;
  }
  function finishStroke(p) {
    scene.remove(p.preview);
    if (N > MAXN) { say('The board is full. Undo or clear to add more clay.'); return; }
    const made = buildPiece(strokeField(p.path, p.r), shadeMats[shade]);
    if (!made) say('The board is full. Undo or clear to add more clay.');
    wake();
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    setRay(e);
    const p = { mode: 'orbit', sx: e.clientX, sy: e.clientY, c: new T3.Vector3() };
    $('hint').classList.add('gone');
    if (tool === 'add') {
      const r = strokeR(), q = landing(r);
      if (q) {
        p.mode = 'add'; p.r = r; p.path = [q]; p.preview = new T3.Group(); scene.add(p.preview);
        const m = new T3.Mesh(ballGeo, shadeMats[shade]); m.position.copy(q); m.scale.setScalar(r); m.castShadow = true; p.preview.add(m);
      }
    } else {
      const hit = hitClay();
      if (hit) {
        const R = fingerR(), nrm = hit.face.normal;
        p.mode = tool;
        if (tool === 'pull') {
          p.c.copy(hit.point);
          p.plane = new T3.Plane().setFromNormalAndCoplanarPoint(new T3.Vector3(0, 1, 0), hit.point);
          p.grabs = [];
          for (let i = 0; i < N; i++) {
            const ox = X[3 * i] - hit.point.x, oy = X[3 * i + 1] - hit.point.y, oz = X[3 * i + 2] - hit.point.z, d2 = ox * ox + oy * oy + oz * oz;
            if (d2 < R * R) { const w = 1 - d2 / (R * R); p.grabs.push({ i, w: w * w, ox, oy, oz }); }
          }
        } else if (tool === 'press') {
          p.c.copy(hit.point).addScaledVector(nrm, R);
          if (p.c.y < R + .014) p.c.y = R + .014;
        } else {
          p.c.copy(hit.point).addScaledVector(nrm, -R * .35);
          p.plane = new T3.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(tmpV).clone(), p.c);
        }
        if (tool !== 'pull') { p.mesh = new T3.Mesh(ballGeo, fingerMat); p.mesh.position.copy(p.c); p.mesh.scale.setScalar(R); scene.add(p.mesh); }
      }
    }
    if (p.mode !== 'orbit') cv.classList.add('holding');
    ptrs.set(e.pointerId, p);
    lastTouch = performance.now(); resetT = 0; wake(); needRender = true;
    $('panel').hidden = true; $('tune-btn').setAttribute('aria-expanded', 'false');
  });
  cv.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    lastTouch = performance.now();
    if (p.mode === 'orbit') {
      const others = [...ptrs.values()].filter(q => q.mode === 'orbit' && q !== p);
      if (others.length) {                              // two fingers on the background: zoom
        const o = others[0], before = Math.hypot(p.sx - o.sx, p.sy - o.sy), after = Math.hypot(e.clientX - o.sx, e.clientY - o.sy);
        if (before > 1) cam.zoom = Math.min(1.9, Math.max(.5, cam.zoom * before / after));
      }
      p.sx = e.clientX; p.sy = e.clientY;
      placeCamera();
      return;
    }
    setRay(e);
    if (p.mode === 'add') { const q = landing(p.r); if (q) extendStroke(p, q); return; }
    wake();
    if (p.mode === 'press') {
      const t = (p.c.y - ray.ray.origin.y) / ray.ray.direction.y;
      if (t > 0) { p.t = p.t || p.c.clone(); p.t.x = ray.ray.origin.x + ray.ray.direction.x * t; p.t.z = ray.ray.origin.z + ray.ray.direction.z * t; }
    } else if (ray.ray.intersectPlane(p.plane, tmpV)) {
      p.t = p.t || new T3.Vector3();
      p.t.copy(tmpV);
      if (p.t.y < 0) p.t.y = 0; else if (p.t.y > 1.1) p.t.y = 1.1;
    }
  });
  function release(id, cancelled) {
    const p = ptrs.get(id);
    if (!p) return;
    ptrs.delete(id);
    if (p.mesh) scene.remove(p.mesh);
    if (p.mode === 'add') { if (cancelled) scene.remove(p.preview); else finishStroke(p); }
    lastTouch = performance.now(); needRender = true;
    if (![...ptrs.values()].some(q => q.mode !== 'orbit')) cv.classList.remove('holding');
  }
  cv.addEventListener('pointerup', e => release(e.pointerId, false));
  cv.addEventListener('pointercancel', e => release(e.pointerId, true));
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    cam.zoom = Math.min(1.9, Math.max(.5, cam.zoom * Math.exp(e.deltaY * .0012)));
    placeCamera();
  }, { passive: false });

  // ---------- controls ----------
  function setTool(t) {
    if (t === 'add' && mode !== 'create') return;
    tool = t;
    for (const b of document.querySelectorAll('.tools button')) b.setAttribute('aria-checked', String(b.dataset.tool === t));
    cv.style.cursor = t === 'add' ? 'crosshair' : '';
  }
  for (const b of document.querySelectorAll('.tools button')) b.addEventListener('click', () => setTool(b.dataset.tool));

  function setMode(m) {
    if (m === mode) return;
    for (const id of [...ptrs.keys()]) release(id, true);
    saveCounts();
    for (const p of W.pieces) scene.remove(p.mesh);
    mode = m; useWorld(worlds[m]);
    for (const p of W.pieces) scene.add(p.mesh);
    const create = m === 'create';
    document.body.classList.toggle('create', create);
    for (const b of document.querySelectorAll('.modes button')) b.setAttribute('aria-checked', String(b.dataset.mode === m));
    $('tool-add').hidden = !create; $('palette').hidden = !create; $('clay-btn').hidden = create;
    $('reset-btn').textContent = create ? 'Clear' : 'Reset';
    setTool(create ? 'add' : 'pull');
    say(create ? 'Drag on the board to lay down clay. Pieces stick where they touch.' : 'Drag the guy to shape him.');
    resetT = 0; wake(); needRender = true;
  }
  for (const b of document.querySelectorAll('.modes button')) b.addEventListener('click', () => setMode(b.dataset.mode));

  for (const b of document.querySelectorAll('.swatch')) b.addEventListener('click', () => {
    shade = +b.dataset.shade;
    for (const s of document.querySelectorAll('.swatch')) s.setAttribute('aria-pressed', String(s === b));
  });
  $('undo-btn').addEventListener('click', () => { if (W.pieces.length) dropPiecesFrom(W.pieces.length - 1); });

  function reset() {
    lastTouch = performance.now();
    cam.az = .35; cam.pol = .78; cam.zoom = 1; placeCamera();
    if (mode === 'create') { dropPiecesFrom(0); $('hint').classList.add('gone'); return; }
    while (W.wa.length) unweld(W.wa.length - 1);
    resetT = 110; wake();
  }
  $('reset-btn').addEventListener('click', reset);

  $('tune-btn').addEventListener('click', () => {
    const open = $('panel').hidden;
    $('panel').hidden = !open;
    $('tune-btn').setAttribute('aria-expanded', String(open));
  });
  for (const k of ['soft', 'mem', 'slide', 'finger']) {
    const el = $(k), sync = () => { P[k] = el.value / 100; $(k + '-out').value = el.value; wake(); };
    el.addEventListener('input', sync); sync();
  }
  $('mesh-btn').addEventListener('click', () => {
    P.mesh = !P.mesh; $('mesh-btn').setAttribute('aria-pressed', String(P.mesh));
    for (const m of allMats) m.wireframe = P.mesh;
    needRender = true;
  });
  $('clay-btn').addEventListener('click', () => {
    P.dark = !P.dark; $('clay-btn').setAttribute('aria-pressed', String(P.dark));
    applyClay();
  });
  $('invert-btn').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    readColors();
  });
  window.addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === '1') setTool('pull'); else if (k === '2') setTool('press'); else if (k === '3') setTool('pinch');
    else if (k === 'a') setTool('add'); else if (k === 'z' && mode === 'create') $('undo-btn').click();
    else if (k === 'r') reset();
  });

  window.addEventListener('resize', resize);
  resize(); readColors();
  window.plasticGuy = { stats: () => { let top = 0; for (let i = 1; i < 3 * N; i += 3) if (X[i] > top) top = X[i]; return { mode, pieces: W.pieces.length, nodes: N, edges: E, tets: NT, welds: W.wa.length, top, asleep, moved: lastMoved }; } };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
